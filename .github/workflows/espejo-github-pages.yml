# Copia de la web en GitHub Pages, fuera de Cloudflare.
# Cuando LaLiga hace bloquear IPs de Cloudflare en España, el dominio se apunta
# aquí (ver README → "Bloqueos de LaLiga") y la web sigue funcionando.

name: Espejo en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *" # refresca las reseñas de Google cada 6 horas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          STATIC_REVIEWS: "1"
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
